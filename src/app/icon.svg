<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a0830"/>
      <stop offset="100%" stop-color="#06020f"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="16" cy="16" r="16" fill="url(#bg)"/>

  <!-- Consciousness ring -->
  <circle cx="16" cy="16" r="11.5" fill="none" stroke="#7c3aed" stroke-width="1" opacity="0.85" filter="url(#glow)"/>

  <!-- Tetrahedral edges (inner connections) -->
  <!-- cardinal cross -->
  <line x1="16" y1="4.5" x2="16" y2="27.5" stroke="#7c3aed" stroke-width="0.6" opacity="0.35"/>
  <line x1="4.5" y1="16" x2="27.5" y2="16" stroke="#7c3aed" stroke-width="0.6" opacity="0.35"/>
  <!-- diagonals -->
  <line x1="8.1" y1="8.1" x2="23.9" y2="23.9" stroke="#7c3aed" stroke-width="0.6" opacity="0.2"/>
  <line x1="23.9" y1="8.1" x2="8.1" y2="23.9" stroke="#7c3aed" stroke-width="0.6" opacity="0.2"/>

  <!-- Nodes on ring — Φ Ψ Θ Ω -->
  <!-- Top: Φ — violet -->
  <circle cx="16" cy="4.5" r="2.2" fill="#a855f7" filter="url(#glow)"/>
  <!-- Right: Ψ — cyan -->
  <circle cx="27.5" cy="16" r="2.2" fill="#06b6d4" filter="url(#glow)"/>
  <!-- Bottom: Θ — emerald -->
  <circle cx="16" cy="27.5" r="2.2" fill="#10b981" filter="url(#glow)"/>
  <!-- Left: Ω — amber -->
  <circle cx="4.5" cy="16" r="2.2" fill="#f59e0b" filter="url(#glow)"/>

  <!-- Center pulse -->
  <circle cx="16" cy="16" r="1.8" fill="#c4b5fd" opacity="0.7" filter="url(#glow)"/>
</svg>

